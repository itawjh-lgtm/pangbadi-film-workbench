<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>作品预览 · 庞巴迪影视工作台</title><style>*{box-sizing:border-box}body{margin:0;background:#151d19;color:#eff4f0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{height:76px;padding:17px 28px;border-bottom:1px solid #ffffff18;display:flex;align-items:center;justify-content:space-between;gap:14px}h1{font-size:16px;font-weight:550;margin:0 0 5px}small{font-size:11px;color:#a9b9ae}a{color:#bed7c6;text-decoration:none;font-size:12px}main{height:calc(100vh - 138px);padding:18px;display:flex;align-items:center;justify-content:center}video,img{max-width:100%;max-height:100%;box-shadow:0 16px 60px #0008;border-radius:8px;background:#0c100e}video{height:100%;min-width:180px}footer{height:62px;padding:16px 28px;border-top:1px solid #ffffff18;font-size:12px;color:#a9b9ae;display:flex;justify-content:space-between;gap:18px}#status.error{color:#ffc2aa}#empty{font-size:14px;line-height:1.8;text-align:center;max-width:550px}</style></head><body><header><div><h1 id="title">正在读取作品…</h1><small id="meta">庞巴迪影视工作台 · 已生成结果</small></div><a href="/workbench.html">返回工作台 →</a></header><main id="preview"><p id="empty">正在读取已保存的媒体记录</p></main><footer><span id="status" role="status">不会重新生成或产生新的生成费用</span><a id="original" hidden target="_blank" rel="noopener noreferrer">打开原文件 ↗</a></footer><script>
(async()=>{const title=document.querySelector('#title'),status=document.querySelector('#status'),preview=document.querySelector('#preview'),meta=document.querySelector('#meta');try{const id=new URL(location.href).searchParams.get('job');if(!id)throw new Error('缺少作品编号，请从工作台的素材卡片打开。');const response=await fetch('/api/media/jobs',{credentials:'same-origin',cache:'no-store'});if(!response.ok)throw new Error('在线工作台暂时未连接，请重新打开工作台。');const data=await response.json(),job=data.jobs?.find(job=>job.id===id);if(!job)throw new Error('该作品不存在或已移入回收站。');if(job.status!=='succeeded')throw new Error('这项任务尚未成功返回文件，请到任务页查看状态。');const output=job.outputs?.find(item=>typeof item.url==='string'&&/^https:\/\//.test(item.url));if(!output)throw new Error('任务没有可播放的媒体结果。');const url=new URL(output.url);if(url.username||url.password)throw new Error('媒体地址无效。');const video=job.mediaKind==='video'||/video|mp4|webm/i.test(output.outputType||url.pathname),media=document.createElement(video?'video':'img');title.textContent=job.name||((job.shotId?job.shotId+' · ':'')+'生成'+(video?'视频':'图片'));meta.textContent=(job.modelId||'RunningHub')+' · '+new Date(job.updatedAt||job.createdAt).toLocaleString('zh-CN');const original=document.querySelector('#original');original.href=url.href;original.hidden=false;if(video){media.controls=true;media.playsInline=true;media.preload='auto';media.autoplay=true;media.muted=true;media.addEventListener('loadedmetadata',()=>{status.textContent='视频已载入 · '+media.duration.toFixed(1)+' 秒 · '+media.videoWidth+' × '+media.videoHeight+' · 点击播放器可开启声音';});media.addEventListener('ended',()=>{status.textContent='播放完成 · '+media.duration.toFixed(3)+' 秒 · 可在播放器重播或开启声音';});media.addEventListener('playing',()=>{status.textContent='正在播放 · '+(media.muted?'静音预览，可在播放器开启声音':'声音已开启');});}else{media.alt=title.textContent;media.addEventListener('load',()=>{status.textContent='图片已载入 · '+media.naturalWidth+' × '+media.naturalHeight;});}media.addEventListener('error',()=>{status.className='error';status.textContent='文件未能载入；可能是网络或平台地址失效。可以尝试右侧原文件链接。';});media.src=url.href;preview.replaceChildren(media);status.textContent='正在载入已生成文件…';}catch(error){title.textContent='作品预览';document.querySelector('#empty').textContent=error.message;status.className='error';status.textContent='保留原始生成记录，未重新提交。';}})();
</script></body></html>
